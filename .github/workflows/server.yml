# This repository's own pipeline: test the tool, show the plan on pull
# requests, apply server.yml on main.
#
# Pull requests that only change the layout, the messages or the tool are merged
# and applied automatically once the tests and the dry run pass (see sync.yml).
# Changes to .github/ and requirements.txt always wait for a manual merge.
name: Discord server

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: plan shows what would change, apply changes the server
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet -r requirements.txt -r presence/requirements.txt
      - run: python -m unittest discover -s tests

  sync:
    needs: test
    uses: ./.github/workflows/sync.yml
    with:
      config: server.yml
      mode: ${{ github.event_name == 'push' && 'apply' || inputs.mode || 'plan' }}
      self: true
      automerge: true
      automerge_files: '^(server\.yml$|content/|discord_sync\.py$|discord_announce\.py$|tests/|ci/|README\.md$)'
    secrets:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
