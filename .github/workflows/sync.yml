# Reusable workflow: plan or apply a Discord layout file.
#
# Called by this repository for the guild config (server.yml) and by the mod
# repositories for their fragments. See README.md for a caller example.
#
# With automerge: true a pull request is merged by this workflow, and applied
# right away, when all of this holds:
#   - it comes from a branch of the repository itself, targets the default
#     branch and is not a draft,
#   - every file it changes matches automerge_files,
#   - the dry run against the server succeeded,
#   - the plan deletes nothing.
# Anything else waits for a manual merge, which applies through the push to main.
name: Discord sync

on:
  workflow_call:
    inputs:
      config:
        description: Path of the layout file in the calling repository
        type: string
        required: true
      mode:
        description: "plan (dry run) or apply"
        type: string
        default: plan
      self:
        description: Only set by this repository itself, to run the tool from the same checkout
        type: boolean
        default: false
      automerge:
        description: Merge and apply pull requests that only change Discord files (needs contents write)
        type: boolean
        default: false
      automerge_files:
        description: Extended regular expression every changed file must match for the automatic merge
        type: string
        default: '^\.discord/'
    secrets:
      DISCORD_BOT_TOKEN:
        required: false

jobs:
  sync:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    # Applies must never overlap; a queued run waits for the running one.
    concurrency:
      group: discord-sync-${{ github.repository }}-${{ inputs.mode }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    outputs:
      mode: ${{ steps.run.outputs.mode }}
      ok: ${{ steps.run.outputs.ok }}
      deletions: ${{ steps.run.outputs.deletions }}
    steps:
      - name: Check out the layout
        uses: actions/checkout@v5

      - name: Check out the sync tool
        if: ${{ !inputs.self }}
        uses: actions/checkout@v5
        with:
          repository: Rykon00/gregtorio-me-network_discord-bot
          path: .discord-sync

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run discord_sync
        id: run
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config }}
          TOOL: ${{ inputs.self && '.' || '.discord-sync' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: bash "$TOOL/ci/sync.sh"

  automerge:
    name: auto-merge
    needs: sync
    if: >-
      inputs.automerge
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && !github.event.pull_request.draft
      && needs.sync.outputs.mode == 'plan'
      && needs.sync.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # No permissions block on purpose: the job uses what the caller grants, so
    # callers without automerge do not have to grant contents write.
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Merge when the pull request only changes Discord files
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FILES: ${{ inputs.automerge_files }}
          DELETIONS: ${{ needs.sync.outputs.deletions }}
        run: |
          skip() {
            echo "::notice::Not merging automatically: $1"
            echo "Not merged automatically: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${DELETIONS:-0}" != 0 ]; then
            skip "the plan deletes something. Check the plan and merge by hand."
          fi
          changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
                      --jq '.[] | .filename, (.previous_filename // empty)') || exit 1
          other=$(printf '%s\n' "$changed" | grep -Ev -- "$FILES" || true)
          if [ -z "$changed" ] || [ -n "$other" ]; then
            skip "it also changes files outside of the Discord layout ($(printf '%s' "$other" | head -n 5 | tr '\n' ' '))."
          fi
          if ! result=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
                          -f merge_method=merge -f sha="$HEAD_SHA" 2>&1); then
            echo "::error::The automatic merge failed (the calling workflow needs 'contents: write'): $result"
            exit 1
          fi
          sha=$(printf '%s' "$result" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Merged automatically as $sha." >> "$GITHUB_STEP_SUMMARY"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" >/dev/null 2>&1 \
            || echo "::notice::The branch $HEAD_REF was not deleted."

  # A merge made with the workflow token does not start the push workflow, so
  # the merged state is applied here.
  apply-merged:
    name: apply after auto-merge
    needs: automerge
    if: needs.automerge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: discord-sync-${{ github.repository }}-apply
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the merged layout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.automerge.outputs.sha }}

      - name: Check out the sync tool
        if: ${{ !inputs.self }}
        uses: actions/checkout@v5
        with:
          repository: Rykon00/gregtorio-me-network_discord-bot
          path: .discord-sync

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run discord_sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MODE: apply
          CONFIG: ${{ inputs.config }}
          TOOL: ${{ inputs.self && '.' || '.discord-sync' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: new
        run: bash "$TOOL/ci/sync.sh"
