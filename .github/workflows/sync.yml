# Reusable workflow: plan or apply a Discord layout file.
#
# Called by this repository for the guild config (server.yml) and by the mod
# repositories for their fragments. See README.md for a caller example.
name: Discord sync

on:
  workflow_call:
    inputs:
      config:
        description: Path of the layout file in the calling repository
        type: string
        required: true
      mode:
        description: "plan (dry run) or apply"
        type: string
        default: plan
      self:
        description: Only set by this repository itself, to run the tool from the same checkout
        type: boolean
        default: false
    secrets:
      DISCORD_BOT_TOKEN:
        required: false

jobs:
  sync:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    # Applies must never overlap; a queued run waits for the running one.
    concurrency:
      group: discord-sync-${{ github.repository }}-${{ inputs.mode }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the layout
        uses: actions/checkout@v5

      - name: Check out the sync tool
        if: ${{ !inputs.self }}
        uses: actions/checkout@v5
        with:
          repository: Rykon00/gregtorio-me-network_discord-bot
          path: .discord-sync

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --quiet -r "$TOOL/requirements.txt"
        env:
          TOOL: ${{ inputs.self && '.' || '.discord-sync' }}

      - name: Run discord_sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config }}
          TOOL: ${{ inputs.self && '.' || '.discord-sync' }}
        run: |
          case "$MODE" in
            plan|apply) ;;
            *) echo "::error::mode must be plan or apply, got '$MODE'"; exit 1 ;;
          esac
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            if [ "$MODE" = apply ]; then
              echo "::error::The DISCORD_BOT_TOKEN secret is missing in this repository."
              exit 1
            fi
            echo "::warning::DISCORD_BOT_TOKEN is not available here (fork or Dependabot pull request?). Validating the config only."
            MODE=validate
          fi
          python "$TOOL/discord_sync.py" "$MODE" \
            --config "$CONFIG" \
            --guild-config "$TOOL/server.yml" \
            --summary-file "$RUNNER_TEMP/discord-sync.md"

      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/discord-sync.md" ]; then
            cat "$RUNNER_TEMP/discord-sync.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "$RUNNER_TEMP/discord-sync.md" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/discord-sync.md" --edit-last --create-if-none \
              || echo "::warning::Could not post the plan as a pull request comment."
          fi
