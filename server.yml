# Guild config for the "Gregtorio & ME Network" Discord server.
#
# This file owns everything that is shared: server settings, the general roles
# and the categories that do not belong to one mod. The per-mod categories live
# in the mod repositories (.discord/server.yml in Gregtorio and me-network) and
# are applied by the same tool.
#
# See README.md for the full reference.

guild_id: "1556776296779088023"

server:
  name: Gregtorio & ME Network
  description: Community for the Factorio mods Gregtorio Continued and ME Network.
  locale: en-US
  verification_level: low          # members need a verified e-mail address
  default_notifications: mentions  # new members are only notified when mentioned
  content_filter: all_members
  community: true                  # needed for announcement channels
  rules_channel: rules
  updates_channel: moderators      # Discord posts its own notices for admins here
  system_channel: joins            # "X joined the server" and boost messages
  invite_channel: welcome          # one permanent invite link; new members land here
  suppress_system_messages: [tips]  # join messages keep their "Wave to say hi!" button

# Discord's own filters. A blocked message is not posted; the report goes to the alert channel.
automod:
  alert_channel: moderators
  exempt_roles: [Maintainer]
  block_spam: true
  block_mention_spam: 6            # more than six mentions in one message; also stops mention raids

everyone:
  # the same set Discord's "Stop @everyone spam" prompt removes
  deny: [mention_everyone, create_guild_expressions, create_events]

# Hoisted roles are the groups of the member list, shown in the order they are listed here.
# Everyone without one of them appears under "Online" / "Offline".
roles:
  - name: Maintainer
    color: "#E67E22"
    hoist: true
    members: [owner]
    permissions:
      - kick_members
      - ban_members
      - moderate_members
      - manage_messages
      - manage_threads
      - manage_nicknames
      - pin_messages
      - view_audit_log
      - mention_everyone
  - name: Contributor
    color: "#3498DB"
    hoist: true
  - name: Tester
    color: "#2ECC71"
    hoist: true
  - name: Bot
    color: "#95A5A6"
    hoist: true
    members: [bot]

categories:
  - name: Information
    position: 0
    read_only: true
    channels:
      - name: welcome
        topic: What this server is about and where to find the mods.
        messages:
          - file: content/welcome.md
      - name: rules
        topic: The server rules. By taking part you agree to follow them.
        messages:
          - file: content/rules.md
      - name: announcements
        type: announcement
        topic: News that concerns both mods. Releases are announced in each mod's own category.

  - name: Community
    previous_names: [Text Channels]
    position: 10
    channels:
      - name: general
        topic: Talk about Factorio, the mods and everything around them.
      - name: showcase
        topic: Screenshots and videos of your factories.
      - name: joins
        topic: Welcome messages for new members. Wave to say hi!

  # positions 20-79 are left free for the per-mod categories

  - name: Staff
    position: 80
    private: true
    visible_to: [Maintainer]
    channels:
      - name: moderators
        topic: Maintainer chat. Discord also posts its community notices here.

  - name: Voice
    previous_names: [Voice Channels]
    position: 90
    channels:
      - name: General
        type: voice
